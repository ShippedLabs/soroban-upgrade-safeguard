name: Test GitHub Action

on:
  pull_request:
    paths:
      - 'action.yml'
      - 'Dockerfile'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths:
      - 'action.yml'
      - 'Dockerfile'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

jobs:
  test-action-local:
    name: Test local WASM comparison
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run safeguard on clean pair
        id: clean-run
        uses: ./
        with:
          old-wasm: tests/wasm/v1.wasm
          new-wasm: tests/wasm/v1.wasm

      - name: Verify clean pair passes
        shell: bash
        run: |
          echo "Verdict: ${{ steps.clean-run.outputs.verdict }}"
          [[ "${{ steps.clean-run.outputs.verdict }}" == "passed" ]] || exit 1

      - name: Run safeguard on breaking pair
        id: breaking-run
        uses: ./
        with:
          old-wasm: tests/wasm/v1.wasm
          new-wasm: tests/wasm/v2.wasm

      - name: Verify breaking pair fails
        shell: bash
        run: |
          echo "Verdict: ${{ steps.breaking-run.outputs.verdict }}"
          [[ "${{ steps.breaking-run.outputs.verdict }}" == "failed" ]] || exit 1

  test-action-json-format:
    name: Test JSON output format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run safeguard with JSON format
        uses: ./
        with:
          old-wasm: tests/wasm/v1.wasm
          new-wasm: tests/wasm/v2.wasm
          format: json

  test-action-strict-mode:
    name: Test strict mode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run safeguard with strict mode on warning-only pair
        id: strict-run
        uses: ./
        with:
          old-wasm: tests/wasm/v1.wasm
          new-wasm: tests/wasm/v3.wasm
          strict: true
        continue-on-error: true

      - name: Verify strict mode fails on warnings
        shell: bash
        run: |
          echo "Verdict: ${{ steps.strict-run.outputs.verdict }}"
          [[ "${{ steps.strict-run.outputs.verdict }}" == "failed" ]] || exit 1
