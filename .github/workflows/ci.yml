name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run the audit on a daily schedule so a newly published advisory is caught
  # even when no code has changed since the last commit.
  schedule:
    - cron: "0 6 * * *"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo build
      - run: cargo test

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-

      # No --fail-under-lines threshold yet: this job measures and reports the
      # baseline. Whether to gate the build on a coverage threshold is a
      # deliberate follow-up decision, made after seeing where the baseline
      # actually lands (see docs/contributing.md#code-coverage).
      - name: Measure coverage
        run: cargo llvm-cov --workspace --summary-only | tee coverage-summary.txt

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "## Code coverage"
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  msrv:
    name: Minimum supported Rust version (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the exact version declared as `rust-version` in Cargo.toml,
      # not `stable`. If a dependency bump silently raises the real floor
      # above this, `--locked` below makes that surface here as a build
      # failure instead of going unnoticed.
      - name: Install Rust 1.85 (declared MSRV)
        uses: dtolnay/rust-toolchain@1.85

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-

      - run: cargo build --locked
      - run: cargo test --locked

  audit:
    name: Dependency audit (vulnerabilities + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cargo-deny checks both vulnerability advisories and license policy in
      # one pass, configured by deny.toml at the repository root.
      #
      # Advisory policy  : block the build (see deny.toml [advisories]).
      # License policy   : block the build (see deny.toml [licenses]).
      # Scheduled runs   : also block, so a newly published advisory surfaces
      #                    as a failed workflow rather than silent green.
      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # Run all four checks: advisories, licenses, bans, sources.
          arguments: --config deny.toml

  docker:
    name: Build and verify Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: soroban-upgrade-safeguard:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image against test fixtures
        shell: bash
        run: |
          set -eo pipefail
          echo "Running verification tests against soroban-upgrade-safeguard:test..."
          
          # 1. Clean pair (v1 vs v1) must pass (exit 0)
          echo "Test 1: Clean pair (v1 vs v1)"
          docker run --rm -v "${{ github.workspace }}/tests/wasm:/wasms" \
            soroban-upgrade-safeguard:test /wasms/v1.wasm /wasms/v1.wasm
          
          # 2. Breaking pair (v1 vs v2) must fail (exit 1)
          echo "Test 2: Breaking pair (v1 vs v2)"
          if docker run --rm -v "${{ github.workspace }}/tests/wasm:/wasms" \
            soroban-upgrade-safeguard:test /wasms/v1.wasm /wasms/v2.wasm; then
            echo "ERROR: Expected breaking pair (v1 vs v2) to fail, but it passed!"
            exit 1
          else
            echo "Successfully detected breaking changes (expected failure)."
          fi
          
          # 3. Warning-only pair (v1 vs v3) must pass without --strict (exit 0)
          echo "Test 3: Warning pair (v1 vs v3) without strict mode"
          docker run --rm -v "${{ github.workspace }}/tests/wasm:/wasms" \
            soroban-upgrade-safeguard:test /wasms/v1.wasm /wasms/v3.wasm
            
          # 4. Warning-only pair (v1 vs v3) must fail with --strict (exit 1)
          echo "Test 4: Warning pair (v1 vs v3) with strict mode"
          if docker run --rm -v "${{ github.workspace }}/tests/wasm:/wasms" \
            soroban-upgrade-safeguard:test /wasms/v1.wasm /wasms/v3.wasm --strict; then
            echo "ERROR: Expected strict mode on warning pair (v1 vs v3) to fail, but it passed!"
            exit 1
          else
            echo "Successfully detected strict mode failure on warnings (expected failure)."
          fi
          
          # 5. JSON output format check
          echo "Test 5: JSON output format check"
          OUTPUT=$(docker run --rm -v "${{ github.workspace }}/tests/wasm:/wasms" \
            soroban-upgrade-safeguard:test /wasms/v1.wasm /wasms/v1.wasm --format json)
          echo "$OUTPUT" | grep -q '"is_safe": true'
          
          echo "All Docker image verification checks passed!"
