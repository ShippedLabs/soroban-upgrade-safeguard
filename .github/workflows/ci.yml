name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run the audit on a daily schedule so a newly published advisory is caught
  # even when no code has changed since the last commit.
  schedule:
    - cron: "0 6 * * *"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo build
      - run: cargo test

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-

      # No --fail-under-lines threshold yet: this job measures and reports the
      # baseline. Whether to gate the build on a coverage threshold is a
      # deliberate follow-up decision, made after seeing where the baseline
      # actually lands (see docs/contributing.md#code-coverage).
      - name: Measure coverage
        run: cargo llvm-cov --workspace --summary-only | tee coverage-summary.txt

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "## Code coverage"
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  msrv:
    name: Minimum supported Rust version (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the exact version declared as `rust-version` in Cargo.toml,
      # not `stable`. If a dependency bump silently raises the real floor
      # above this, `--locked` below makes that surface here as a build
      # failure instead of going unnoticed.
      - name: Install Rust 1.85 (declared MSRV)
        uses: dtolnay/rust-toolchain@1.85

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-

      - run: cargo build --locked
      - run: cargo test --locked

  audit:
    name: Dependency audit (vulnerabilities + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cargo-deny checks both vulnerability advisories and license policy in
      # one pass, configured by deny.toml at the repository root.
      #
      # Advisory policy  : block the build (see deny.toml [advisories]).
      # License policy   : block the build (see deny.toml [licenses]).
      # Scheduled runs   : also block, so a newly published advisory surfaces
      #                    as a failed workflow rather than silent green.
      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # Run all four checks: advisories, licenses, bans, sources.
          arguments: --config deny.toml
