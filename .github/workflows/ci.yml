name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        # A cache hit is a performance optimization only. The hashFiles()
        # cache-key evaluation is intermittently flaky on GitHub runners and
        # can fail the whole job for an unrelated infra reason, so never let
        # the cache step take the job down.
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

      - name: Check Public API Changes
        run: python scripts/check_api_changes.py

      - name: Validate workflow example YAML syntax
        run: |
          python3 - <<'EOF'
          import sys, pathlib, yaml
          errors = []
          for p in pathlib.Path("docs/workflow-examples").glob("*.yml"):
              try:
                  yaml.safe_load_all(p.read_text())
              except yaml.YAMLError as e:
                  errors.append(f"{p}: {e}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print(f"OK: {len(list(pathlib.Path('docs/workflow-examples').glob('*.yml')))} workflow example(s) parsed cleanly.")
          EOF

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        # A cache hit is a performance optimization only. The hashFiles()
        # cache-key evaluation is intermittently flaky on GitHub runners and
        # can fail the whole job for an unrelated infra reason, so never let
        # the cache step take the job down.
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: cargo build
      - run: cargo test
