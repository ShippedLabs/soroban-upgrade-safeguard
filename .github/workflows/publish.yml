name: Publish to crates.io

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'README.md'
      - 'LICENSE*'
      - '.github/workflows/publish.yml'

jobs:
  publish:
    name: Verify and publish crate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-publish-

      - name: Verify manifest metadata and version agreement
        shell: bash
        run: |
          python3 -c '
          import json, sys, subprocess, os

          meta = json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"]))
          pkg = meta["packages"][0]

          required_fields = ["name", "version", "description", "license", "repository", "readme"]
          missing = [f for f in required_fields if not pkg.get(f)]

          if missing:
              print(f"ERROR: Missing required manifest metadata fields in Cargo.toml: {missing}", file=sys.stderr)
              sys.exit(1)

          name = pkg["name"]
          ver = pkg["version"]
          print(f"Manifest metadata OK for {name} v{ver}")

          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/"):
              tag = ref.replace("refs/tags/", "")
              tag_ver = tag[1:] if tag.startswith("v") else tag
              if tag_ver != ver:
                  print(f"ERROR: Git tag ({tag}) does not agree with Cargo.toml version ({ver})!", file=sys.stderr)
                  sys.exit(1)
              print(f"Tag version ({tag_ver}) matches Cargo.toml version ({ver})")
          '

      - name: Run publish dry run
        run: cargo publish --dry-run

      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
