# Example suppression config for Soroban Upgrade Safeguard.
#
# Copy this to `.safeguard.toml` in your repo root (or pass it explicitly with
# `--config`) to acknowledge known, intentional breaking changes so they no
# longer fail the run. Suppressed findings are still shown in the report,
# clearly marked, so the acknowledgement stays auditable.
#
# Matching is EXACT: a rule applies only when both `category` and `target`
# equal the finding's own values. This keeps a suppression from over-applying
# to a sibling field, case, or parameter. Run with `--format json` to discover
# the precise `category` and `target` of any finding you want to suppress.
#
# `target` convention:
#   - functions ............ the function name        e.g. "transfer"
#   - function parameters .. "function.param"         e.g. "transfer.to"
#   - types ................ the type name            e.g. "ConfigData"
#   - struct fields ........ "Type.field"             e.g. "ConfigData.threshold"
#   - enum cases ........... "Enum.case"              e.g. "StatusEvent.Paused"
#
# Omit `target` to match only findings that have no target (e.g. "Environment").
#
# Uncomment to require a non-blank `reason` for suppressions matching selected
# rule IDs and/or compatibility axes — for findings risky enough that an
# unexplained suppression isn't reviewable. Omitting this table (the default)
# leaves `reason` optional everywhere, as above.
#
# [require_reason]
# rule_ids = ["struct_field_removed"]
# axes     = ["storage_layout"]

[[suppress]]
category = "Struct Field Removed"
target   = "ConfigData.threshold"
reason   = "Planned storage migration in v2 drops the unused threshold field."

[[suppress]]
category = "Function Signature Changed"
target   = "initialize"
reason   = "Re-init is intentional and gated behind the migration admin call."


# ─── Named policy profiles (optional) ───────────────────────────────────────
#
# Everything above (suppressions, classification data) is shared by every
# profile. A profile only controls *policy*: gating, severity (`strict`),
# the suppression budget (`max_suppressions`), resource limits, and output
# formatting. This lets local dev, PR checks, and release validation share
# one file instead of duplicating suppressions across three.
#
# Select one with `--profile <name>`, or set `default_profile` below so a
# bare invocation picks one up. `--profile` and `SAFEGUARD_PROFILE` both win
# over `default_profile`. See `docs/named_policy_profiles.md` for the full
# precedence rules and provenance format.
#
# default_profile = "pr"
#
# [profiles.dev]
# strict = false
#
# [profiles.pr]
# inherits = "dev"   # builds on `dev`; its own fields win on conflict
# strict   = true
#
# [profiles.pr.gating]
# gate_event_indexer = true
#
# [profiles.release]
# inherits = "pr"
# format   = "json"
#
# [profiles.release.limits]
# max_xdr_depth = 32