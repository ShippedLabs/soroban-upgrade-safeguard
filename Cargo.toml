[package]
name = "soroban-upgrade-safeguard"
version = "0.1.0"
edition = "2021"
description = "A safety tool to check for breaking changes in Soroban contract upgrades."

[lib]
name = "soroban_upgrade_safeguard"
path = "src/lib.rs"

[[bin]]
name = "soroban-upgrade-safeguard"
path = "src/main.rs"

[dependencies]
# WASM parsing
wasmparser = "0.201.0"

# Stellar/Soroban XDR
stellar-xdr = { version = "21.2.0", features = ["std", "curr", "base64"] }
stellar-strkey = "0.0.8"

# CLI and Utilities
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
colored = "2.1"
hex = "0.4"
sha2 = "0.10"
ring = "0.17"
base64 = "0.22"
ureq = { version = "2.9", features = ["json"] }

# Watch mode
notify = { version = "7.0", optional = true }
# Unix SIGTERM handling for watch mode's clean shutdown path.
libc = { version = "0.2", optional = true }

[dev-dependencies]
# Property-based testing for the decode + type-walk paths (see
# tests/diff_properties.rs and tests/fuzz_walk.rs). Dev-only: it does not
# affect the shipped binary.
proptest = "1"
regex = "1"
public-api = "0.52.1"
rustdoc-json = "0.9.10"
rustup-toolchain = "0.1.10"

[features]
default = ["unstable"]
watch = ["notify", "libc"]
unstable = []
