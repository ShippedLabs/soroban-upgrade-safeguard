[package]
name = "soroban-upgrade-safeguard"
version = "0.1.0"
edition = "2021"
# Determined from the dependency graph actually locked in Cargo.lock (see
# `cargo metadata`'s per-package `rust_version` field): clap 4.6.1 is the
# highest floor among all direct and transitive dependencies, at 1.85. Raising
# a dependency above its current locked version can raise this floor further;
# see docs/contributing.md#minimum-supported-rust-version for the policy on
# when that requires bumping this field.
rust-version = "1.85"
description = "A safety tool to check for breaking changes in Soroban contract upgrades."
license = "MIT"
repository = "https://github.com/ShippedLabs/soroban-upgrade-safeguard"
readme = "README.md"
keywords = ["soroban", "stellar", "smart-contracts", "wasm", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "soroban_upgrade_safeguard"
path = "src/lib.rs"

[[bin]]
name = "soroban-upgrade-safeguard"
path = "src/main.rs"

[[bench]]
name = "pipeline"
harness = false

[dependencies]
# WASM parsing
wasmparser = "0.201.0"
# WebAssembly Text format assembler — converts .wat to binary before analysis.
wat = { version = "1.254", default-features = false }

# Stellar/Soroban XDR
stellar-xdr = { version = "21.2.0", features = ["std", "curr", "arbitrary", "base64"] }
stellar-strkey = "0.0.8"

# CLI and Utilities
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# JSON Schema generation for the report output types (see schema/). Deriving the
# schema from the types keeps it from drifting away from what is serialized.
schemars = "0.8"
toml = "0.8"
colored = "2.1"
indicatif = "0.17"
hex = "0.4"
sha2 = "0.10"
ureq = { version = "2.9", features = ["json"] }
base64 = "0.22"
# Platform-appropriate user cache directory (e.g. ~/.cache on Linux,
# ~/Library/Caches on macOS, %LOCALAPPDATA% on Windows).
dirs = "5.0"
# Bounded data-parallelism for comparing batch pairs concurrently (see
# compare_contracts' caller in main.rs). Defaults to one worker per available
# CPU; override with the RAYON_NUM_THREADS environment variable.
rayon = "1"

[dev-dependencies]
# Temporary directory / file helpers used by wasm_cache tests.
tempfile = "3"
# Property-based/fuzz testing for the decode + type-walk paths (see
# tests/fuzz_walk.rs). Dev-only: it does not affect the shipped binary.
proptest = "1"
# Validates real emitted JSON output against the committed schema (see
# tests/schema_validation.rs) so the schema and the output cannot drift apart.
jsonschema = "0.49"
# Benchmark harness for the analysis pipeline (see benches/pipeline.rs).
# Dev-only: does not affect the shipped binary.
criterion = "0.5"
