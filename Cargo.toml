[package]
name = "soroban-upgrade-safeguard"
version = "0.1.0"
edition = "2021"
description = "A safety tool to check for breaking changes in Soroban contract upgrades."

[lib]
name = "soroban_upgrade_safeguard"
path = "src/lib.rs"

[[bin]]
name = "soroban-upgrade-safeguard"
path = "src/main.rs"

[dependencies]
# WASM parsing
wasmparser = "0.201.0"

# Stellar/Soroban XDR
stellar-xdr = { version = "21.2.0", features = ["std", "curr", "arbitrary", "base64"] }
stellar-strkey = "0.0.8"

# CLI and Utilities
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
colored = "2.1"
indicatif = "0.17"
hex = "0.4"
sha2 = "0.10"
ureq = { version = "2.9", features = ["json"] }

[dev-dependencies]
# Property-based/fuzz testing for the decode + type-walk paths (see
# tests/fuzz_walk.rs). Dev-only: it does not affect the shipped binary.
proptest = "1"

# Snapshot testing for the report renderers, and the format-conformance check
# that every field is surfaced in every format (see tests/report_snapshots.rs
# and tests/format_conformance.rs). Dev-only: it does not affect the shipped
# binary.
insta = "1"
